<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYH | Operations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#f4f6f8; --surface:#ffffff; --border:#e3e6eb; --border-soft:#edf0f3;
  --text:#171f2b; --text-dim:#5b6675; --text-mute:#97a1b0;
  --primary:#1d4ed8; --primary-dim:rgba(29,78,216,.08); --primary-hover:#1741b0;
  --success:#157a45; --success-dim:rgba(21,122,69,.09);
  --danger:#c62828; --danger-dim:rgba(198,40,40,.08);
  --warning:#a8660a; --warning-dim:rgba(168,102,10,.1);
  --info:#0a7298; --info-dim:rgba(10,114,152,.08);
  --purple:#6741c9; --purple-dim:rgba(103,65,201,.08);
  --gray:#5b6675; --gray-dim:rgba(91,102,117,.08);
  --radius:10px; --radius-sm:7px;
  --shadow-sm:0 1px 2px rgba(20,30,50,.05);
  --shadow-md:0 8px 24px rgba(20,30,50,.10);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px}
.mono{font-family:'JetBrains Mono',monospace}
.icon{display:inline-block;vertical-align:middle;flex:none}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d4d8de;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 15% 20%, #eef2f9 0%, var(--bg) 45%), var(--bg);padding:20px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;box-shadow:var(--shadow-md)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login-logo .mark{width:38px;height:38px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.login-logo .name{font-size:18px;font-weight:800;letter-spacing:-.3px}
.login-sub{color:var(--text-mute);font-size:12.5px;margin-bottom:26px}
.demo-box{background:var(--bg);border:1px solid var(--border-soft);border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--text-dim);margin-top:18px;line-height:1.55}
.demo-box b{color:var(--text)}
.login-err{background:var(--danger-dim);color:var(--danger);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none}

#shell{display:flex;min-height:100vh}
.sidebar{width:262px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:40;transition:transform .25s ease}
.sb-brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-soft)}
.sb-brand .mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.sb-brand .nm{font-weight:800;font-size:15px;letter-spacing:-.2px}
.sb-brand .sx{font-size:10.5px;color:var(--text-mute);font-weight:600;letter-spacing:.3px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 0 8px}
.nav-sec{margin-bottom:6px}
.nav-sec-label{font-size:10.5px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.6px;padding:12px 22px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:1px 10px;border-radius:8px;color:var(--text-dim);font-size:13.3px;font-weight:600;cursor:pointer;user-select:none}
.nav-item:hover{background:var(--primary-dim);color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item.disabled{opacity:.5;cursor:not-allowed}
.nav-item.disabled:hover{background:none;color:var(--text-dim)}
.nav-soon{margin-left:auto;font-size:9.5px;font-weight:700;background:var(--border-soft);color:var(--text-mute);padding:2px 7px;border-radius:20px;letter-spacing:.3px}
.sb-foot{border-top:1px solid var(--border-soft);padding:10px}
.sb-foot .nav-item{color:var(--text-dim)}

.main{flex:1;margin-left:262px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:30}
.tb-title{font-size:18px;font-weight:800;letter-spacing:-.3px;flex:1}
.tb-date{font-size:12px;color:var(--text-mute);font-weight:500;margin-right:4px}
.hamb{display:none}
.page{padding:22px;max-width:1320px;width:100%;margin:0 auto}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(15,20,30,.4);z-index:35}

@media(max-width:900px){
 .sidebar{transform:translateX(-100%)}
 body.sb-open .sidebar{transform:translateX(0)}
 .main{margin-left:0}
 body.sb-open .sb-overlay{display:block}
 .hamb{display:flex}
 .tb-date{display:none}
 .fgrid{grid-template-columns:1fr!important}
}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card+.card{margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.card-head h3{font-size:14.5px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--c,var(--primary));border-radius:var(--radius);padding:14px 16px}
.stat .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--c-dim,var(--primary-dim));color:var(--c,var(--primary));margin-bottom:10px}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1}
.stat .l{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--border-soft)}
.btn-p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-hover)}
.btn-d{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn-d:hover{background:var(--danger-dim)}
.btn-g{background:var(--success);border-color:var(--success);color:#fff}
.btn-g:hover{opacity:.9}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px;width:32px;height:32px;justify-content:center}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bd-primary{background:var(--primary-dim);color:var(--primary)}
.bd-success{background:var(--success-dim);color:var(--success)}
.bd-danger{background:var(--danger-dim);color:var(--danger)}
.bd-warning{background:var(--warning-dim);color:var(--warning)}
.bd-info{background:var(--info-dim);color:var(--info)}
.bd-purple{background:var(--purple-dim);color:var(--purple)}
.bd-gray{background:var(--border-soft);color:var(--text-dim)}

.input,select,textarea.ta{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13.3px;font-family:inherit;background:#fff;color:var(--text)}
.input:focus,select:focus,textarea.ta:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-dim)}
textarea.ta{resize:vertical;min-height:64px}
label.fl{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.frow{margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:11px;color:var(--text-mute);margin-top:4px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .input,.toolbar select{width:auto;min-width:150px}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px}
.search-box .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-mute)}
.search-box input{padding-left:34px}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;background:var(--border-soft);color:var(--text-dim);font-size:10.8px;text-transform:uppercase;letter-spacing:.4px;padding:10px 14px;white-space:nowrap;font-weight:700}
td{padding:11px 14px;border-top:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap}
tr:hover td{background:#fafbfc}
.empty-row td{text-align:center;color:var(--text-mute);padding:34px;white-space:normal}

.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-dim);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.row-flex{display:flex;align-items:center;gap:10px}
.namecol .nm{font-weight:700;font-size:13.3px}
.namecol .sub{font-size:11.3px;color:var(--text-mute)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--text-mute);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-color:var(--primary)}

.section-soon{text-align:center;padding:60px 20px;color:var(--text-mute)}
.section-soon .ic{width:54px;height:54px;border-radius:14px;background:var(--border-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--text-mute)}
.section-soon h3{color:var(--text);margin-bottom:6px}

#modalRoot{display:none;position:fixed;inset:0;z-index:100}
#modalRoot.open{display:block}
.modal-ov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-md)}
.modal-sm{max-width:420px}
.modal-md{max-width:640px}
.modal-lg{max-width:940px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--border);flex:none}
.modal-head h3{font-size:15.5px}
.modal-body{padding:22px;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex:none}

#toastBox{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px 14px;display:flex;align-items:flex-start;gap:9px;font-size:12.8px;font-weight:600;box-shadow:var(--shadow-md);animation:slideIn .25s ease}
.toast.out{opacity:0;transform:translateX(10px);transition:.25s}
.t-success{border-left:3px solid var(--success);color:var(--success)}
.t-error{border-left:3px solid var(--danger);color:var(--danger)}
.t-info{border-left:3px solid var(--info);color:var(--info)}
.t-warn{border-left:3px solid var(--warning);color:var(--warning)}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

.notif-wrap{position:relative}
.bell-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}
.notif-pop{position:absolute;top:46px;right:0;width:320px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);z-index:60;display:none;max-height:420px;overflow-y:auto}
.notif-pop.open{display:block}
.notif-pop-head{padding:13px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border-soft);font-size:12.6px;cursor:pointer}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:var(--primary-dim)}
.notif-item .t{font-weight:700;margin-bottom:2px}
.notif-item .b{color:var(--text-dim)}
.notif-item .ts{color:var(--text-mute);font-size:11px;margin-top:4px}

.usermenu-wrap{position:relative}
.usermenu{position:absolute;top:48px;right:0;width:190px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);z-index:60;display:none;overflow:hidden}
.usermenu.open{display:block}
.usermenu .it{padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;gap:8px}
.usermenu .it:hover{background:var(--bg)}

.day-pill{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:10.5px;font-weight:700;background:var(--border-soft);color:var(--text-mute)}
.day-pill.on{background:var(--primary);color:#fff}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.kv .it .l{font-size:10.8px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-bottom:3px}
.kv .it .v{font-size:13.6px;font-weight:600}

.divider{height:1px;background:var(--border-soft);margin:16px 0}
.muted{color:var(--text-mute)}
body.modal-lock{overflow:hidden}
.progress-bar{height:6px;border-radius:4px;background:var(--border-soft);overflow:hidden}
.progress-bar .fill{height:100%}
</style>
</head>
<body>

<div id="toastBox"></div>
<div id="modalRoot"></div>
<div id="root"></div>

<script>
/* ===================================================================
   ICONS
=================================================================== */
const ICN = {

activity:'<polyline points="2.5 12 7 12 9.5 18.5 14 4.5 16.5 12 21.5 12"/>',

xcircle:'<circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>',
chart:'<line x1="4.5" y1="20" x2="4.5" y2="10.5"/><line x1="10.5" y1="20" x2="10.5" y2="4.5"/><line x1="16.5" y1="20" x2="16.5" y2="13.5"/><line x1="20" y1="20" x2="4.5" y2="20"/>',
message:'<path d="M4 5.5h16v10H9l-4 4v-4H4z"/>',
mail:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><polyline points="3.5 7 12 13 20.5 7"/>',
bell:'<path d="M6.5 9.5a5.5 5.5 0 0 1 11 0v4.3l1.8 2.7H4.7l1.8-2.7z"/><path d="M10.2 19.5a1.8 1.8 0 0 0 3.6 0"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5"/><line x1="20.5" y1="20.5" x2="15.3" y2="15.3"/>',

trash:'<polyline points="3.5 6.5 5.5 6.5 20.5 6.5"/><path d="M8.5 6.5v-2a1.5 1.5 0 0 1 1.5-1.5h4a1.5 1.5 0 0 1 1.5 1.5v2"/><path d="M6.5 6.5l1 13a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4l1-13"/>',

menu:'<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>',

phone:'<path d="M5 4.5h3.5l1.5 4-2 1.3a11 11 0 0 0 5.2 5.2l1.3-2 4 1.5V18a2 2 0 0 1-2 2A14.5 14.5 0 0 1 3 5.5a2 2 0 0 1 2-1z"/>',

award:'<circle cx="12" cy="8.5" r="5.5"/><polyline points="8.5 13.3 7 21.5 12 18.5 17 21.5 15.5 13.3"/>',
refresh:'<polyline points="3 4.5 3 9 7.5 9"/><polyline points="21 19.5 21 15 16.5 15"/><path d="M3.6 13.5A9 9 0 0 0 20 16.5M20.4 10.5A9 9 0 0 0 4 7.5"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5"/><path d="M16.5 6.5l2 2"/><path d="M14 9l2 2"/>'

async function loadData(){
  try{
    const r = await window.storage.get(STORE_KEY,true);
    if(r && r.value){ DATA = JSON.parse(r.value); if(!DATA.timechart) DATA.timechart=[]; if(!DATA.slots) DATA.slots=[]; if(!DATA.batches) DATA.batches=[]; return; }
  }catch(e){ /* key not found or error -> seed */ }
  DATA = seedData();
  await persist();
}
async function persist(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(DATA), true); }
  catch(e){ console.error('Storage save failed', e); toast('Could not save changes. Please retry.','error'); }
}
async function getSession(){
  try{ const r = await window.storage.get('gyh_session_uid', false); return r?r.value:null; }catch(e){ return null; }
}
async function setSession(uid){ try{ await window.storage.set('gyh_session_uid', uid, false); }catch(e){} }
async function clearSessionStore(){ try{ await window.storage.delete('gyh_session_uid', false); }catch(e){} }

function doTcDailyReset(){
  const t = todayStr();
  let changed=false;
  (DATA.timechart||[]).forEach(tc=>{
    const updDate = (tc.updatedAt||'').slice(0,10);
    if(updDate!==t){ tc.todayStatus='not-started'; tc.updatedAt=new Date().toISOString(); changed=true; }
  });
  return changed;
}

function toast(msg,type){
  type = type||'info';
  const box=document.getElementById('toastBox');
  const ic = type==='success'?'checkcircle':type==='error'?'xcircle':type==='warn'?'alert':'bell';
  const el=document.createElement('div');
  el.className='toast t-'+type;
  el.innerHTML='<span>'+icon(ic,16)+'</span><span>'+esc(msg)+'</span>';
  box.appendChild(el);
  while(box.children.length>3) box.removeChild(box.firstChild);
  setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); },280); },4000);
}

function openModal(size,title,bodyHtml,footHtml){
  const root=document.getElementById('modalRoot');
  root.innerHTML =
    '<div class="modal-ov" data-act="closeModalBg">'+
      '<div class="modal modal-'+size+'" onclick="event.stopPropagation()">'+
        '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="btn btn-icon" data-act="closeModal">'+icon('x',16)+'</button></div>'+
        '<div class="modal-body">'+bodyHtml+'</div>'+
        (footHtml?'<div class="modal-foot">'+footHtml+'</div>':'')+
      '</div>'+
    '</div>';
  root.classList.add('open');
  document.body.classList.add('modal-lock');
}
function closeModal(){
  document.getElementById('modalRoot').classList.remove('open');
  document.getElementById('modalRoot').innerHTML='';
  document.body.classList.remove('modal-lock');
}

async function doLogin(){
  const email = val('li_email').trim();
  const password = val('li_password');
  const role = val('li_role');
  const errEl = document.getElementById('li_err');
  errEl.style.display='none';
  if(!email || !password || !role){ errEl.textContent='Please fill in all fields.'; errEl.style.display='block'; return; }
  const u = DATA.users.find(x=>x.email.toLowerCase()===email.toLowerCase() && x.role===role);
  if(!u){ errEl.textContent='No account matches that email and role combination.'; errEl.style.display='block'; return; }
  if(!u.active){ errEl.textContent='This account has been deactivated. Contact an administrator.'; errEl.style.display='block'; return; }
  if(u.password!==password){ errEl.textContent='Incorrect password.'; errEl.style.display='block'; return; }
  CU=u; CR=u.role;
  await setSession(u.id);
  startApp();
}

function sessionsTable(list, compact){
  list = list.slice().sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
  if(!list.length) return '<div class="table-wrap"><table><tbody><tr class="empty-row"><td>No sessions to display.</td></tr></tbody></table></div>';
  const canManage = CR==='admin'||CR==='coordinatorhead'||CR==='coordinator';
  return '<div class="table-wrap"><table><thead><tr>'+
    (compact?'':'<th>Date</th>')+'<th>Time</th><th>Client</th><th>Trainer</th><th>Type</th><th>Status</th><th>Actions</th>'+
    '</tr></thead><tbody>'+
    list.map(function(s){
      let actions='';
      if(s.status==='not-started') actions='<button class="btn btn-sm btn-p" data-act="sessStart" data-id="'+s.id+'">Start</button>';
      else if(s.status==='onair') actions='<button class="btn btn-sm btn-g" data-act="sessDone" data-id="'+s.id+'">Done</button> <button class="btn btn-sm btn-d" data-act="sessMiss" data-id="'+s.id+'">Miss</button>';
      if(canManage){ actions += ' <button class="btn btn-sm btn-icon" data-act="editSession" data-id="'+s.id+'">'+icon('pencil',13)+'</button>'; if(CR!=='coordinator') actions += ' <button class="btn btn-sm btn-icon" data-act="deleteSession" data-id="'+s.id+'">'+icon('trash',13)+'</button>'; }
      return '<tr>'+(compact?'':'<td>'+fmtDate(s.date)+'</td>')+'<td class="mono">'+esc(s.time)+'</td><td><b>'+esc(s.clientName)+'</b></td><td>'+esc(s.trainerName)+'</td><td>'+esc(s.type)+'</td><td>'+statusBadge(s.status)+'</td><td><div class="btn-row">'+actions+'</div></td></tr>';
    }).join('')+
    '</tbody></table></div>';
}

function pageSessions(){
  const tab = FILT.sessions.tab;
  const today = todayStr();
  let list = visibleSessions();
  if(tab==='today') list = list.filter(function(s){return s.date===today;});
  else if(tab==='upcoming') list = list.filter(function(s){return s.date>today;});
  else if(tab==='past') list = list.filter(function(s){return s.date<today;});
  if(FILT.sessions.status) list = list.filter(function(s){return s.status===FILT.sessions.status;});
  if(FILT.sessions.q){ const q=FILT.sessions.q.toLowerCase(); list = list.filter(function(s){return s.clientName.toLowerCase().includes(q)||s.trainerName.toLowerCase().includes(q);}); }
  const canAdd = CR!=='trainer';
  return '<div class="tabs">'+
    ['today','upcoming','past','all'].map(function(t){ return '<div class="tab '+(tab===t?'active':'')+'" data-act="sessTab" data-id="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</div>'; }).join('')+
  '</div>'+
  '<div class="toolbar">'+
    '<div class="search-box">'+icon('search',15)+'<input class="input" placeholder="Search client or trainer" oninput="FILT.sessions.q=this.value;renderPage()" value="'+esc(FILT.sessions.q)+'"></div>'+
    '<select onchange="FILT.sessions.status=this.value;renderPage()">'+
      '<option value="">All Statuses</option>'+
      ['not-started','onair','completed','missed'].map(function(s){ return '<option value="'+s+'" '+(FILT.sessions.status===s?'selected':'')+'>'+s.replace('-',' ')+'</option>'; }).join('')+

    (canAdd?'<button class="btn btn-p" data-act="newSession" style="margin-left:auto">'+icon('plus',15)+' Schedule Session</button>':'')+

  '<div class="card">'+sessionsTable(list,false)+'</div>';

async function confirmMiss(id){
  const s=DATA.sessions.find(function(x){return x.id===id;}); if(!s) return;
  s.status='missed'; s.missedReason = val('mr_reason')+(val('mr_notes')?(' \u2014 '+val('mr_notes')):'');
  const cl = clientById(s.clientId);
  const targets = [].concat(activeUsers('admin').map(function(u){return u.id;}), activeUsers('coordinatorhead').map(function(u){return u.id;}));
  if(cl && cl.coordinatorId) targets.push(cl.coordinatorId);
  await pushNotif(targets,'Session missed', (s.clientName||'A client')+'\u2019s session with '+s.trainerName+' was marked missed. Reason: '+s.missedReason, 'missed');
  await persist();
  closeModal(); toast('Missed session logged and coordinators notified.','warn'); renderPage();
}

async function saveClient(id){
  const trainer = userById(val('cf_trainer')); const coord = userById(val('cf_coord'));
  const wasActive = id ? clientById(id).active : true;
  const nowActive = val('cf_active')==='1';
  const data = {
    name: val('cf_name'), plan: val('cf_plan'), phone: val('cf_phone'), email: val('cf_email'),
    age: Number(val('cf_age'))||null, gender: val('cf_gender'), city: val('cf_city'), country: val('cf_country'),
    goal: val('cf_goal'), sessionsPerWeek: Number(val('cf_spw'))||0,
    trainerId: trainer?trainer.id:'', trainerName: trainer?trainer.name:'',
    coordinatorId: coord?coord.id:'', coordinatorName: coord?coord.name:'',
    weight: Number(val('cf_weight'))||null, height: Number(val('cf_height'))||null,
    startDate: val('cf_start'), active: nowActive
  };
  if(['Platinum','Platinum Plus'].indexOf(data.plan)>-1){ data.sessionTime=val('cf_stime'); data.sessionType=val('cf_stype'); data.sessionRemarks=val('cf_remarks'); }
  if(data.plan==='Couple'){ data.partnerName=val('cf_pname'); data.partnerPhone=val('cf_pphone'); }
  let client;
  if(id){ client = clientById(id); Object.assign(client,data); }
  else { data.id = nid('c'); DATA.clients.push(data); client = data; }
  if(wasActive && !nowActive){
    closeModal();
    await persist();
    promptInactiveReason(client.id);
    return;
  }
  if(!wasActive && nowActive){ client.inactiveReason=''; client.endDate=''; }
  await persist(); closeModal(); toast('Client saved.','success'); renderPage();
}

function viewClient(id, _el, _e, tab){
  const c = clientById(id); if(!c) return;
  tab = tab||'overview';

  const fus = DATA.followups.filter(function(f){return f.clientId===id;});
  const completed = sess.filter(function(s){return s.status==='completed';}).length;
  const missed = sess.filter(function(s){return s.status==='missed';}).length;
  const attRate = sess.length? Math.round(completed/sess.length*100) : 0;
  const bmi = (c.weight && c.height)? (c.weight/Math.pow(c.height/100,2)).toFixed(1) : null;
  const tabs=['overview','sessions','followups'];
  let body = '<div class="kv" style="margin-bottom:16px">'+
    '<div class="it"><div class="l">Days Active</div><div class="v">'+(c.startDate?daysBetween(c.startDate,todayStr()):'\u2014')+'</div></div>'+
    '<div class="it"><div class="l">Attendance Rate</div><div class="v">'+attRate+'%</div></div>'+
    '<div class="it"><div class="l">Total Sessions</div><div class="v">'+sess.length+'</div></div>'+
    '<div class="it"><div class="l">Missed Sessions</div><div class="v">'+missed+'</div></div>'+
  '</div>';
  if(!c.active){
    body += '<div class="badge bd-warning" style="display:flex;gap:8px;padding:10px 14px;margin-bottom:16px;border-radius:8px">'+icon('alert',14)+' Marked '+(c.inactiveReason==='paused'?'Paused / Dropped':'Programme Ended')+
      (c.endDate?(' on '+fmtDate(c.endDate)):'')+'<button class="btn btn-sm btn-p" style="margin-left:auto" data-act="reactivateClient" data-id="'+c.id+'">Reactivate</button></div>';
  }
  body += '<div class="tabs">'+tabs.map(function(t){ return '<div class="tab '+(tab===t?'active':'')+'" data-act="clientViewTab" data-id="'+id+'" data-tab="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</div>'; }).join('')+'</div>';
  if(tab==='overview'){
    body += '<div class="kv">'+
      '<div class="it"><div class="l">Phone</div><div class="v">'+esc(c.phone||'\u2014')+'</div></div>'+
      '<div class="it"><div class="l">Email</div><div class="v">'+esc(c.email||'\u2014')+'</div></div>'+
      '<div class="it"><div class="l">Age / Gender</div><div class="v">'+esc(c.age||'\u2014')+' / '+esc(c.gender||'\u2014')+'</div></div>'+
      '<div class="it"><div class="l">City</div><div class="v">'+esc(c.city||'\u2014')+'</div></div>'+
      '<div class="it"><div class="l">Plan</div><div class="v">'+planBadge(c.plan)+'</div></div>'+
      '<div class="it"><div class="l">Goal</div><div class="v">'+esc(c.goal||'\u2014')+'</div></div>'+
      '<div class="it"><div class="l">Trainer</div><div class="v">'+esc(c.trainerName||'\u2014')+'</div></div>'+
      '<div class="it"><div class="l">Coordinator</div><div class="v">'+esc(c.coordinatorName||'\u2014')+'</div></div>'+
      (bmi?'<div class="it"><div class="l">BMI</div><div class="v">'+bmi+'</div></div>':'')+
      '<div class="it"><div class="l">Start Date</div><div class="v">'+fmtDate(c.startDate)+'</div></div>'+
    '</div>';
    if(c.sessionTime){ body += '<div class="divider"></div><label class="fl">Fixed Schedule</label><div class="kv"><div class="it"><div class="l">Time</div><div class="v mono">'+esc(c.sessionTime)+'</div></div><div class="it"><div class="l">Type</div><div class="v">'+esc(c.sessionType||'')+'</div></div></div>'; }
    if(c.partnerName){ body += '<div class="divider"></div><label class="fl">Partner</label><div class="kv"><div class="it"><div class="l">Name</div><div class="v">'+esc(c.partnerName)+'</div></div><div class="it"><div class="l">Phone</div><div class="v">'+esc(c.partnerPhone||'')+'</div></div></div>'; }
  } else if(tab==='sessions'){ body += sessionsTable(sess,false); }

    const pr={High:0,Medium:1,Low:2}; if(pr[a.priority]!==pr[b.priority]) return pr[a.priority]-pr[b.priority];
    return a.dueDate.localeCompare(b.dueDate);
  });

async function saveLeave(){
  const from=val('lv_from'), to=val('lv_to');
  if(to<from){ toast('"To" date cannot be before "From" date.','error'); return; }
  const days = daysBetween(from,to)+1;
  DATA.leaves.push({id:nid('l'),userId:CU.id,userName:CU.name,role:CR,from:from,to:to,days:days,reason:val('lv_reason'),notes:val('lv_notes'),status:'pending'});

  );

async function confirmReview(id,el){
  const decision = el.getAttribute('data-decision');
  const l = DATA.leaves.find(function(x){return x.id===id;});
  l.status=decision; l.reviewedBy=CU.name; l.reviewNote=val('rv_note');
  await pushNotif([l.userId],'Leave request '+decision,'Your leave request for '+fmtDate(l.from)+' to '+fmtDate(l.to)+' was '+decision+(l.reviewNote?(': '+l.reviewNote):'.'),'leave');
  await persist(); closeModal(); toast('Leave request '+decision+'.','success'); renderPage();
}

    missed:list.filter(function(t){return t.todayStatus==='missed';}).length,

function pageSlots(){
  const periods=['Morning','Afternoon','Evening','Night'];
  const isAdmin = CR==='admin';
  const totalEnrolled = DATA.slots.reduce(function(sum,x){return sum+x.enrolledClientIds.length;},0);
  const fullCount = DATA.slots.filter(function(x){return x.enrolledClientIds.length>=x.maxCapacity;}).length;
  let html='';
  if(isAdmin){
    html += '<div class="stat-grid">'+
      statCard('calendar','primary',DATA.slots.length,'Total Slots')+
      statCard('users','info',totalEnrolled,'Total Enrolled')+
      statCard('xcircle','danger',fullCount,'Full Slots')+
      statCard('checkcircle','success',DATA.slots.length-fullCount,'Open Slots')+
    '</div>';
    html += '<div class="toolbar"><button class="btn" data-act="setupDefaultSlots">'+icon('refresh',15)+' Setup Defaults</button><button class="btn btn-p" data-act="newSlot" style="margin-left:auto">'+icon('plus',15)+' Add Custom Slot</button></div>';
  }
  periods.forEach(function(p){
    const list = DATA.slots.filter(function(s){return (s.period||'Morning')===p;});
    if(!list.length) return;
    html += '<div class="card-head" style="margin-top:18px"><h3>'+esc(p)+'</h3></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:8px">'+list.map(function(s){ return slotCard(s,isAdmin); }).join('')+'</div>';
  });
  const customs = DATA.slots.filter(function(s){return s.isCustom && periods.indexOf(s.period)===-1;});
  if(customs.length){
    html += '<div class="card-head" style="margin-top:18px"><h3>Custom</h3></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:8px">'+customs.map(function(s){ return slotCard(s,isAdmin); }).join('')+'</div>';
  }
  if(!DATA.slots.length){ html += '<div class="card"><div class="section-soon"><div class="ic">'+icon('calendar',24)+'</div><h3>No time slots configured</h3>'+(isAdmin?'<button class="btn btn-p" data-act="setupDefaultSlots" style="margin-top:10px">Setup Default Slots</button>':'')+'</div></div>'; }
  return html;
}
function slotCard(s,isAdmin){
  const full = s.enrolledClientIds.length>=s.maxCapacity;
  const pct = Math.min(100, Math.round(s.enrolledClientIds.length/s.maxCapacity*100));
  const enrolled = s.enrolledClientIds.map(function(id){return clientById(id);}).filter(Boolean);
  return '<div class="card" style="border-top:3px solid '+(full?'var(--danger)':'var(--success)')+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'+
      '<div><div class="mono" style="font-weight:700;font-size:15px;color:var(--primary)">'+esc(s.time)+'</div><div class="nm" style="font-size:13.5px;font-weight:700">'+esc(s.displayName)+'</div></div>'+
      (full?'<span class="badge bd-danger">Full</span>':'<span class="badge bd-success">Open</span>')+
    '</div>'+
    (s.isCustom?'<span class="badge bd-purple" style="margin-bottom:8px">Custom</span>':'')+
    '<div class="kv" style="margin:8px 0">'+
      '<div class="it"><div class="l">Trainer</div><div class="v">'+esc(s.trainerName||'Unassigned')+'</div></div>'+
      (s.genderHint?'<div class="it"><div class="l">Preference</div><div class="v">'+esc(s.genderHint)+'</div></div>':'')+
    '</div>'+
    (s.notes?'<div class="hint" style="margin-bottom:8px">'+esc(s.notes)+'</div>':'')+
    '<div class="progress-bar" style="margin-bottom:6px"><div class="fill" style="width:'+pct+'%;background:'+(pct>80?'var(--danger)':'var(--primary)')+'"></div></div>'+
    '<div class="hint" style="margin-bottom:10px">'+s.enrolledClientIds.length+' / '+s.maxCapacity+' enrolled</div>'+
    (isAdmin && enrolled.length? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">'+enrolled.map(function(c){ return '<span class="badge bd-gray">'+esc(c.name)+' <span data-act="slotRemoveClient" data-id="'+s.id+'|'+c.id+'" style="cursor:pointer;margin-left:3px">&times;</span></span>'; }).join('')+'</div>' : '')+
    '<div class="btn-row">'+
      (isAdmin?'<button class="btn btn-sm" data-act="manageSlot" data-id="'+s.id+'">Manage</button>':'')+
      (!full?'<button class="btn btn-sm btn-p" data-act="slotEnroll" data-id="'+s.id+'">Enroll Client</button>':'')+
      (s.isCustom&&isAdmin?'<button class="btn btn-sm btn-icon" data-act="deleteSlot" data-id="'+s.id+'">'+icon('trash',13)+'</button>':'')+
    '</div>'+
  '</div>';
}

function renderTopbarBell(){ const unread = myNotifications().filter(function(n){return !n.read;}).length; const btn=document.querySelector('.notif-wrap .btn'); if(btn){ btn.innerHTML = icon('bell',18)+(unread?'<span class="bell-dot"></span>':''); } }
function toggleSidebar(){ document.body.classList.toggle('sb-open'); }
function closeSidebar(){ document.body.classList.remove('sb-open'); }

function changePw(){
  openModal('sm','Change Password',
    '<div class="frow"><label class="fl">Current Password</label><input class="input" type="password" id="pw_old"></div>'+
    '<div class="frow"><label class="fl">New Password</label><input class="input" type="password" id="pw_new"></div>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn btn-p" data-act="confirmChangePw">Update Password</button>'
  );
}
async function confirmChangePw(){
  if(val('pw_old')!==CU.password){ toast('Current password is incorrect.','error'); return; }
  if(val('pw_new').length<6){ toast('New password must be at least 6 characters.','error'); return; }
  CU.password = val('pw_new'); await persist(); closeModal(); toast('Password updated successfully.','success');
}
function sendReset(){ closeModal(); toast('If an account exists for that email, a reset link has been sent.','success'); }
function resetDemo(){
  openModal('sm','Reset Demo Data','<p>This restores all clients, sessions, users, and records to the original demo dataset. Your current changes will be lost.</p>',
    '<button class="btn" data-act="closeModal">Cancel</button><button class="btn btn-d" data-act="confirmResetDemo">Reset Data</button>');
}
async function confirmResetDemo(){ DATA = seedData(); await persist(); closeModal(); toast('Demo data has been reset.','success'); renderApp(); }

/* ===================================================================
   ACTION DISPATCH
=================================================================== */
const ACTIONS = {
  login:doLogin, forgot:openForgot, sendReset:sendReset,
  nav:function(id){ go(id); }, go:function(id){ go(id); }, toggleSidebar:toggleSidebar, closeSidebar:closeSidebar,
  toggleNotif:toggleNotif, toggleUserMenu:toggleUserMenu, readNotif:readNotif, markAllRead:markAllRead,
  logout:doLogout, changePw:changePw, confirmChangePw:confirmChangePw, resetDemo:resetDemo, confirmResetDemo:confirmResetDemo,
  closeModal:closeModal, closeModalBg:closeModal,
  newClient:newClient, editClient:editClient, viewClient:viewClient, deleteClient:deleteClient, confirmDeleteClient:confirmDeleteClient, saveClient:saveClient, reactivateClient:reactivateClient,
  editClientFromView:editClientFromView, clientViewTab:clientViewTab, setInactiveReason:setInactiveReason,
  newUser:newUser, editUser:editUser, deleteUser:deleteUser, confirmDeleteUser:confirmDeleteUser, saveUser:saveUser, usersTab:usersTab,
  viewTrainer:viewTrainer,
  sessTab:sessTab, newSession:newSession, editSession:editSession, deleteSession:deleteSession, confirmDeleteSession:confirmDeleteSession, saveSession:saveSession,
  sessStart:sessStart, sessDone:sessDone, sessMiss:sessMiss, confirmMiss:confirmMiss,
  newFollowup:newFollowup, saveFollowup:saveFollowup, markFuDone:markFuDone, markFuProgress:markFuProgress, deleteFollowup:deleteFollowup, confirmDeleteFu:confirmDeleteFu,
  newLeave:newLeave, saveLeave:saveLeave, cancelLeave:cancelLeave, reviewLeave:reviewLeave, confirmReview:confirmReview,
  tcTab:tcTab, tcView:tcView, newTc:newTc, editTc:editTc, saveTc:saveTc, tcStart:tcStart, tcDone:tcDone, tcReset:tcReset,
  tcMiss:tcMiss, confirmTcMiss:confirmTcMiss, deleteTc:deleteTc, confirmDeleteTc:confirmDeleteTc, tcToggleDay:tcToggleDay, tcPreset:tcPreset,
  newSlot:newSlot, manageSlot:manageSlot, saveSlot:saveSlot, deleteSlot:deleteSlot, confirmDeleteSlot:confirmDeleteSlot,
  setupDefaultSlots:setupDefaultSlots, slotEnroll:slotEnroll, confirmSlotEnroll:confirmSlotEnroll, slotRemoveClient:slotRemoveClient,
  newBatch:newBatch, editBatch:editBatch, saveBatch:saveBatch, deleteBatch:deleteBatch, confirmDeleteBatch:confirmDeleteBatch,
  batchAddClient:batchAddClient, confirmBatchAddClient:confirmBatchAddClient, batchRemoveClient:batchRemoveClient
};
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.getAttribute('data-act');
  const id = t.getAttribute('data-id');
  if(ACTIONS[act]) ACTIONS[act](id, t, e);
});
document.addEventListener('keydown', function(e){ if(e.key==='Enter'){ const ae=document.activeElement; if(ae && (ae.id==='li_password'||ae.id==='li_email')) doLogin(); } });

/* ===================================================================
   BOOT
=================================================================== */
(async function boot(){
  await loadData();
  if(doTcDailyReset()) await persist();
  const uid = await getSession();
  if(uid){ const u = DATA.users.find(function(x){return x.id===uid && x.active;}); if(u){ CU=u; CR=u.role; startApp(); return; } }
  renderLogin();
})();
</script>
